<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuity Camera Stream</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }
        h1 {
            margin-top: 20px;
        }
        video {
            width: 90%;
            max-width: 800px;
            border: 5px solid white;
            border-radius: 10px;
            margin-top: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>

    <h1>Live Camera Feed</h1>
    <img id="video-stream" src="{{ url_for('video_feed') }}" alt="Camera Feed">
    <br>
    <button onclick="window.location.reload();">Refresh Stream</button>

</body>
</html>
